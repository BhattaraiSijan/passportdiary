name: CI
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # world.json is left out: shape simplification differs in the last decimals
      # between operating systems. It is checked by data:validate instead.
      - name: Generated data is up to date
        run: |
          npm run data:build
          git diff --exit-code -- public/data ':!public/data/world.json'
          git checkout -- public/data/world.json
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
